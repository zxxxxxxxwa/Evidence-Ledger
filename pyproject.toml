[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger"
version = "0.1.0"
description = "Evidence-aware professional development workspace for higher-education teachers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evidence-ledger = "app.server:main"

[tool.setuptools]
packages = ["app"]
py-modules = ["openai_messages_client"]

[tool.setuptools.package-data]
app = ["data/*.json", "static/*.html", "static/*.css", "static/*.js", "static/*.json"]
